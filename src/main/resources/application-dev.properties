# Database - SQL Server (desenvolvimento local)
# Quando a API está em um container e o SQL Server está no host,
# use host.docker.internal como DB_SERVER_URL.
# A senha vem da variável de ambiente DB_PWD (não versionar credenciais).
spring.datasource.url=jdbc:sqlserver://${DB_SERVER_URL:localhost}:${DB_SERVER_PORT:1433};databaseName=${DB_SCHEMA:zelodb};encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PWD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
